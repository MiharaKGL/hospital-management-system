<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Management System</title><link rel="stylesheet" href="style.css"></head><body>
<section id="login"><div class="box"><h1>Hospital Management System</h1><p>Sign in to continue</p>
<input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
<button onclick="login()">Login</button><small id="err"></small></div></section>
<div id="app" hidden><button class="menu" onclick="document.body.classList.toggle('nav-open')">☰ Menu</button><nav></nav><main id="main"></main></div>
<div id="modal"></div><script src="app.js"></script></body></html>
